name: Build All Versions

on:
  push:
    tags:
      - 'lazodiscs-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 1.21.1
          - 1.21.2
          - 1.21.3
          - 1.21.4
          - 1.21.5
          - 1.21.6
          - 1.21.7
          - 1.21.8
          - 1.21.9
          - 1.21.10
          - 1.21.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Fabric ${{ matrix.version }}
        working-directory: fabric/${{ matrix.version }}
        run: ./gradlew build --no-daemon

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ matrix.version }}
          path: |
            fabric/${{ matrix.version }}/build/libs/*.jar
            !fabric/${{ matrix.version }}/build/libs/*-sources.jar
            !fabric/${{ matrix.version }}/build/libs/*-dev.jar
            !fabric/${{ matrix.version }}/build/libs/*-dev-shadow.jar
            !fabric/${{ matrix.version }}/build/libs/*-thin.jar
          if-no-files-found: error
          retention-days: 7

  build-neoforge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 1.21.1
          - 1.21.2
          - 1.21.3
          - 1.21.4
          - 1.21.5
          - 1.21.6
          - 1.21.7
          - 1.21.8
          - 1.21.9
          - 1.21.10
          - 1.21.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build NeoForge ${{ matrix.version }}
        working-directory: neoforge/${{ matrix.version }}
        run: ./gradlew build --no-daemon

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-${{ matrix.version }}
          path: |
            neoforge/${{ matrix.version }}/build/libs/*.jar
            !neoforge/${{ matrix.version }}/build/libs/*-sources.jar
            !neoforge/${{ matrix.version }}/build/libs/*-dev.jar
            !neoforge/${{ matrix.version }}/build/libs/*-dev-shadow.jar
            !neoforge/${{ matrix.version }}/build/libs/*-thin.jar
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - build-fabric
      - build-neoforge

    if: startsWith(github.ref, 'refs/tags/lazodiscs-')

    runs-on: ubuntu-latest

    steps:
      - name: Download all release JARs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: |
          echo "Release artifacts:"
          find artifacts -maxdepth 1 -type f -name '*.jar' -print | sort
          echo "Count:"
          find artifacts -maxdepth 1 -type f -name '*.jar' | wc -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.jar
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
