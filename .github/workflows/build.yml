name: Verify and build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['lazodiscs-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify projects and resources
        run: node tools/verify-projects.mjs
      - name: Check Java formatting
        run: node tools/format-java.mjs --check
      - name: Behavioral regressions
        run: node tools/verify-quality-fixes.mjs
      - name: Jukebox startup regressions
        run: node tools/test-jukebox-resync.mjs
      - name: Release tool regressions
        run: node tools/test-release-tools.mjs
      - name: Bundled notice regressions
        run: node tools/test-bundled-notices.mjs

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        loader: [fabric, neoforge]
        minecraft: [1.21.1, 1.21.2, 1.21.3, 1.21.4, 1.21.5, 1.21.6, 1.21.7, 1.21.8, 1.21.9, 1.21.10, 1.21.11]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build exact target
        working-directory: ${{ matrix.loader }}/${{ matrix.minecraft }}
        run: ./gradlew clean build --no-daemon --console=plain --max-workers=2
      - name: Inspect release JAR
        run: node tools/prepare-release.mjs --all-targets --loader=${{ matrix.loader }} --minecraft=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: dist/*/all-targets-*/*.jar
          if-no-files-found: error
          retention-days: 14

  release-draft:
    if: startsWith(github.ref, 'refs/tags/lazodiscs-')
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Preserve an existing manually prepared release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json id > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Match tag to source version
        if: steps.existing-release.outputs.exists != 'true'
        id: release-info
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release.json")); if(process.env.RELEASE_TAG!==r.mod_id+"-"+r.version) throw new Error("Tag/source version mismatch"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "version="+r.version+"\n");'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.existing-release.outputs.exists != 'true'
        with:
          pattern: release-*
          path: dist/ci-jars
          merge-multiple: true
      - name: Prepare all source targets for review
        if: steps.existing-release.outputs.exists != 'true'
        run: node tools/prepare-release.mjs --all-targets --input=dist/ci-jars
      - name: Create draft for human review
        if: steps.existing-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body_path: release-notes/${{ steps.release-info.outputs.version }}.md
          files: dist/*/all-targets/*.jar
