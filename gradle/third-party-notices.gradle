import java.nio.charset.StandardCharsets
import java.util.zip.ZipFile

// Shadow's duplicate exclusion runs before transformers. Only legal-resource
// collisions are appended; class/resource duplicate exclusion stays unchanged.
def mergedLegalPaths = [
        'META-INF/LICENSE', 'META-INF/LICENSE.txt',
        'META-INF/NOTICE', 'META-INF/NOTICE.txt'
]
def supplementalNotices = file('../../third-party')
def shadedArchive = tasks.named('shadowJar')

shadedArchive.configure {
    filesMatching(mergedLegalPaths) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergedLegalPaths.each { append it }
    from(supplementalNotices) {
        into 'META-INF/third-party'
    }
}

// Minecraft 26.1+ is unobfuscated, so Loom produces ordinary (non-remapped) JARs.
def releaseArchive = project.hasProperty('lazoReleaseArchive') ? tasks.named(project.lazoReleaseArchive) :
        tasks.findByName('remapJar') != null ? tasks.named('remapJar') : shadedArchive
def verifyBundledNotices = tasks.register('verifyBundledNotices') {
    group = 'verification'
    description = 'Checks that release archives preserve every bundled upstream legal resource.'
    dependsOn releaseArchive
    if (project.hasProperty('lazoReleasePreparationTasks')) dependsOn project.lazoReleasePreparationTasks
    inputs.file(releaseArchive.flatMap { it.archiveFile })
    inputs.files(provider { shadedArchive.get().includedDependencies })
    inputs.dir(supplementalNotices)

    doLast {
        def archiveFile = releaseArchive.get().archiveFile.get().asFile
        int checked = 0
        new ZipFile(archiveFile).withCloseable { archive ->
            def requirePreserved = { String path, byte[] original, String source ->
                def entry = archive.getEntry(path)
                def actual = entry == null ? '' : archive.getInputStream(entry).withCloseable {
                    new String(it.readAllBytes(), StandardCharsets.UTF_8)
                }
                if (entry == null || !actual.contains(new String(original, StandardCharsets.UTF_8))) {
                    throw new GradleException("Missing or incomplete ${path} from ${source} in ${archiveFile.name}")
                }
                checked++
            }
            shadedArchive.get().includedDependencies.files.each { dependency ->
                new ZipFile(dependency).withCloseable { upstream ->
                    upstream.entries().each { entry ->
                        if (!entry.directory && entry.name ==~ /(?i)(?:META-INF\/)?[^\/]*(?:LICENSE|NOTICE|COPYING)[^\/]*/) {
                            def original = upstream.getInputStream(entry).withCloseable { it.readAllBytes() }
                            requirePreserved(entry.name, original, dependency.name)
                        }
                    }
                }
            }
            fileTree(supplementalNotices).visit { entry ->
                if (!entry.directory) {
                    requirePreserved('META-INF/third-party/' + entry.relativePath.pathString,
                            entry.file.bytes, entry.file.name)
                }
            }
        }
        logger.lifecycle("Verified ${checked} complete upstream legal resources in ${archiveFile.name}")
    }
}

tasks.named('check') { dependsOn verifyBundledNotices }
